          - 窗口函数基础: SQL/windows_function/notes1.md
          - 窗口函数进阶: SQL/windows_function/notes2.md
      - 淘宝用户分析项目:
          - 项目说明: SQL/TaoBao_project/index.md
          - 数据库设计: SQL/TaoBao_project/taobao.md
          - 附：数据迁移: SQL/TaoBao_project/mysqldata.md
          - 附：实战建议: SQL/TaoBao_project/suggest.md
  - Power BI:
      - Power BI 系统指南: PowerBI/index.md
  - Excel:
      - Excel/index.md
      - Excel 报表开发实战:
          - 月度销售报表实战: Excel/ExcelBsae/ExcelBlog01.md
  - Projects:
      - Projects/index.md
      - 个人工具与自动化脚本:
          - Git 交互式提交助手: Projects/myself_tools/Git_Interactive_Commit_Tool.md
          - PPT 批量转 PDF 工具: Projects/myself_tools/PPT_to_PDF_Automation_Tool.md
          - AI 对话导航插件: Projects/myself_tools/AI_Chat_Navigation_Plugin.md
      - 样式参考: Projects/Style_Guide.md

